name: GOLF GUFF Ring CI

on:
  push:
    branches:
      - main
      - 'saelis/**'
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DGUFF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage install
        run: cmake --install build --config Release --prefix build/install
      - name: Package alpha
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package
      - name: Upload alpha package
        uses: actions/upload-artifact@v4
        with:
          name: golf-guff-alpha-${{ matrix.os }}
          path: build/package/*
          if-no-files-found: error

  hardened-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan + UBSan
        run: cmake -S . -B build-hardened -DCMAKE_BUILD_TYPE=Debug -DGUFF_BUILD_TESTS=ON -DGUFF_ENABLE_SANITIZERS=ON
      - name: Build hardened
        run: cmake --build build-hardened --parallel
      - name: Test hardened
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-hardened --output-on-failure
